<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Document Outline -->
  <rect x="10" y="8" width="44" height="48" rx="6" fill="#1e1e24" stroke="url(#bgGrad)" stroke-width="3" />
  
  <!-- Document Lines (Abstracted Text) -->
  <line x1="18" y1="18" x2="36" y2="18" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  <line x1="18" y1="26" x2="42" y2="26" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6" />
  <line x1="18" y1="34" x2="30" y2="34" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6" />
  
  <!-- AI Sparkle (Magic Spark) -->
  <g transform="translate(38, 38) scale(0.9)" filter="url(#glow)">
    <!-- Main sparkle shape -->
    <path d="M 12 0 C 12 6.6 6.6 12 0 12 C 6.6 12 12 17.4 12 24 C 12 17.4 17.4 12 24 12 C 17.4 12 12 6.6 12 0 Z" fill="url(#bgGrad)" />
    <!-- Secondary small sparkle -->
    <path d="M -4 -4 C -4 -1.8 -2.2 0 0 0 C -2.2 0 -4 1.8 -4 4 C -4 1.8 -5.8 0 -8 0 C -5.8 0 -4 -1.8 -4 -4 Z" fill="#ffffff" opacity="0.9" />
  </g>
</svg>
